  <style>
    /*
      Beide Familien stehen unter SIL OFL 1.1; die Lizenztexte liegen neben den Dateien in
      public/assets/fonts/. `unicode-range` entfaellt bewusst - es wird nur das Latin-Subset
      ausgeliefert, das die deutschen Umlaute und das Eszett bereits enthaelt.
    */
    @font-face {
      font-family: 'Chakra Petch';
      font-style: normal;
      font-weight: 500;
      font-display: block;
      src: url('assets/fonts/chakra-petch-500.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Chakra Petch';
      font-style: normal;
      font-weight: 700;
      font-display: block;
      src: url('assets/fonts/chakra-petch-700.woff2') format('woff2');
    }
    /* Variabler Schnitt: eine Datei bedient die gesamte Gewichtsachse. */
    @font-face {
      font-family: 'JetBrains Mono';
      font-style: normal;
      font-weight: 100 800;
      font-display: block;
      src: url('assets/fonts/jetbrains-mono-variable.woff2') format('woff2');
    }

    * { margin: 0; padding: 0; }
    body { background: #000; overflow: hidden; }
    /*
      Bewusst kein `image-rendering: pixelated` auf der Canvas. Das Spiel laeuft mit
      `smoothPixelArt`, dessen Shader blockige Pixel bereits im Renderer erhaelt und nur
      deren Kanten glaettet; eine zusaetzliche Nearest-Neighbor-Skalierung im Browser
      wuerde das wieder zunichte machen. Vor allem aber ist die Canvas-Aufloesung an die
      dargestellte Flaeche gekoppelt (siehe src/graphics/RenderResolution.ts) - der Browser
      skaliert also im Regelfall gar nicht mehr, und wo doch, sind krumme Faktoren
      gefiltert deutlich sauberer als hart gerastert.
