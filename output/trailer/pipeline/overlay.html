<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Chakra'; src: url('file:///C:/Fragdachse/public/assets/fonts/chakra-petch-700.woff2') format('woff2'); font-weight: 700; }
@font-face { font-family: 'Chakra'; src: url('file:///C:/Fragdachse/public/assets/fonts/chakra-petch-500.woff2') format('woff2'); font-weight: 500; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
#stage { position: absolute; inset: 0; }
.layer { position: absolute; inset: 0; pointer-events: none; }
.bar { position: absolute; left: 0; right: 0; height: 120px; background: #000; }
#barTop { top: 0; } #barBot { bottom: 0; }
.word { position: absolute; left: 0; right: 0; text-align: center; font-family: 'Chakra'; font-weight: 700; white-space: nowrap; }
.big { top: 760px; font-size: 132px; letter-spacing: 0.06em; line-height: 1;
  background: linear-gradient(180deg, #fffaf0 0%, #fbe7bd 45%, #e8c170 72%, #be772b 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 6px 14px rgba(0,0,0,.75)) drop-shadow(0 0 28px rgba(232,193,112,.28)); }
.rule { position: absolute; top: 912px; left: 50%; height: 4px; background: linear-gradient(90deg, rgba(232,193,112,0), #e8c170 20%, #fff1cf 50%, #e8c170 80%, rgba(232,193,112,0)); transform: translateX(-50%); box-shadow: 0 0 12px rgba(232,193,112,.6); }
.quiet { top: 830px; font-size: 58px; font-weight: 500; letter-spacing: 0.34em; color: rgba(244,238,226,.94); text-shadow: 0 3px 16px rgba(0,0,0,.9); }
#logo { top: 400px; font-size: 168px; letter-spacing: 0.14em; line-height: 1; padding-left: 0.14em;
  background: linear-gradient(180deg, #fffaf0 0%, #fbe7bd 38%, #e8c170 66%, #be772b 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 8px 20px rgba(0,0,0,.85)) drop-shadow(0 0 40px rgba(232,193,112,.35)); }
#logoRule { top: 598px; }
.tag { top: 640px; font-size: 50px; letter-spacing: 0.22em; color: #f1d9a0; text-shadow: 0 3px 18px rgba(0,0,0,.95), 0 0 30px rgba(0,0,0,.6); }
.sub { top: 712px; font-size: 34px; font-weight: 500; letter-spacing: 0.3em; color: rgba(240,236,228,.92); text-shadow: 0 2px 12px rgba(0,0,0,.95); }
#cta { position: absolute; top: 830px; left: 50%; transform: translateX(-50%); padding: 20px 56px 22px; border: 3px solid #e8c170; border-radius: 6px;
  background: linear-gradient(180deg, rgba(40,28,12,.82), rgba(20,14,8,.88)); box-shadow: 0 0 40px rgba(232,193,112,.35), inset 0 0 24px rgba(232,193,112,.18);
  font-family: 'Chakra'; font-weight: 700; font-size: 56px; letter-spacing: 0.18em; color: #fff1cf; white-space: nowrap; text-shadow: 0 0 18px rgba(232,193,112,.5); }
#url { top: 972px; font-size: 30px; font-weight: 500; letter-spacing: 0.12em; color: rgba(232,193,112,.95); text-shadow: 0 2px 10px rgba(0,0,0,.95); }
#endShade { background: radial-gradient(ellipse 70% 60% at 50% 58%, rgba(6,8,10,.72) 0%, rgba(6,8,10,.55) 55%, rgba(6,8,10,.35) 100%), linear-gradient(180deg, rgba(0,0,0,0) 20%, rgba(6,8,10,.5) 100%); }
#flash { background: #fff; }
#black { background: #000; }
</style></head>
<body><div id="stage">
  <div class="layer" id="endShade"></div>
  <div class="bar" id="barTop"></div><div class="bar" id="barBot"></div>
  <div id="words"></div>
  <div class="word" id="logo">FRAGDACHSE</div><div class="rule" id="logoRule"></div>
  <div class="word tag" id="tag">KOOP-ÜBERLEBEN GEGEN ZOMBIE-HORDEN</div>
  <div class="word sub" id="sub">DIREKT IM BROWSER</div>
  <div id="cta">JETZT SPIELEN</div>
  <div class="word" id="url">dominik-steinweg.github.io/Fragdachse</div>
  <div class="layer" id="flash"></div>
  <div class="layer" id="black"></div>
</div>
<script>
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const eo = t => 1 - Math.pow(1 - clamp(t), 3);
const ei = t => Math.pow(clamp(t), 3);
const ramp = (t, a, b) => clamp((t - a) / (b - a));
// Big alliteration words: [text, in, out]
const BIG = [
  ['BALLERN.', 10.52, 12.25],
  ['BAUEN.', 12.52, 14.25],
  ['BRUTZELN.', 14.52, 16.25],
  ['BOSSE BEZWINGEN.', 16.52, 18.3],
  ['BETEN.', 18.56, 19.42],
  ['BOMBARDIEREN.', 24.52, 26.3],
];
const QUIET = [
  ['SIE SIND VIELE.', 0.55, 3.9],
  ['WIR SIND DACHSE.', 4.6, 7.95],
];
const words = document.getElementById('words');
const bigEls = BIG.map(([txt]) => { const d = document.createElement('div'); d.className = 'word big'; d.textContent = txt; words.append(d);
  const r = document.createElement('div'); r.className = 'rule'; words.append(r); return [d, r]; });
const quietEls = QUIET.map(([txt]) => { const d = document.createElement('div'); d.className = 'word quiet'; d.textContent = txt; words.append(d); return d; });
const $ = id => document.getElementById(id);
const flashes = [ // [time, peak, attack, decay]
  [8.5, 0.85, 0.0, 0.22],
  [16.5, 0.35, 0.0, 0.12],
  [19.5, 0.55, 0.0, 0.25],
  [30.5, 0.9, 0.02, 0.35],
];
window.renderAt = (t) => {
  // Letterbox during the cold open, snapping away on the drop
  const barH = t < 8.5 ? 120 : 120 * (1 - eo((t - 8.5) / 0.18));
  $('barTop').style.height = barH + 'px'; $('barBot').style.height = barH + 'px';
  // Quiet cold-open lines
  QUIET.forEach(([, a, b], i) => { const el = quietEls[i];
    const o = Math.min(ramp(t, a, a + 0.7), 1 - ramp(t, b - 0.5, b));
    el.style.opacity = o; el.style.letterSpacing = (0.34 + 0.06 * ramp(t, a, b)) + 'em'; });
  // Big words: slam in, hold, quick exit
  BIG.forEach(([, a, b], i) => { const [el, rule] = bigEls[i];
    if (t < a || t > b + 0.01) { el.style.opacity = 0; rule.style.opacity = 0; return; }
    const k = eo((t - a) / 0.12), out = ramp(t, b - 0.14, b);
    el.style.opacity = k * (1 - out);
    el.style.transform = `scale(${1.28 - 0.28 * k + 0.04 * out})`;
    el.style.filter = `blur(${(1 - k) * 10 + out * 6}px) drop-shadow(0 6px 14px rgba(0,0,0,.75)) drop-shadow(0 0 28px rgba(232,193,112,.28))`;
    const w = eo((t - a - 0.05) / 0.35) * 560;
    rule.style.width = w + 'px'; rule.style.opacity = (1 - out) * clamp((t - a) / 0.05); });
  // End card
  const endIn = ramp(t, 32.9, 33.9);
  $('endShade').style.opacity = eo(endIn);
  const lk = eo(ramp(t, 32.95, 33.35));
  $('logo').style.opacity = lk; $('logo').style.transform = 'scale(' + (1.18 - 0.18 * lk + 0.012 * ramp(t, 33.35, 39.5)) + ')';
  $('logo').style.filter = 'blur(' + ((1 - lk) * 12) + 'px) drop-shadow(0 8px 20px rgba(0,0,0,.85)) drop-shadow(0 0 ' + (40 + 60 * Math.max(0, 1 - ramp(t, 33.2, 34.2))) + 'px rgba(232,193,112,.35))';
  $('logoRule').style.width = (eo(ramp(t, 33.25, 33.9)) * 1100) + 'px'; $('logoRule').style.opacity = lk;
  const tagK = eo(ramp(t, 33.7, 34.3)), subK = eo(ramp(t, 34.1, 34.7));
  $('tag').style.opacity = tagK; $('tag').style.transform = `translateY(${(1 - tagK) * 24}px)`; $('tag').style.letterSpacing = (0.3 - 0.08 * tagK) + 'em';
  $('sub').style.opacity = subK; $('sub').style.transform = `translateY(${(1 - subK) * 18}px)`;
  const ctaK = eo(ramp(t, 36.5, 36.72));
  $('cta').style.opacity = ctaK; $('cta').style.transform = `translateX(-50%) scale(${1.25 - 0.25 * ctaK})`;
  const pulse = t > 36.72 ? 0.35 + 0.15 * Math.sin((t - 36.72) * Math.PI * 2) : 0.35;
  $('cta').style.boxShadow = `0 0 ${40 + 30 * pulse}px rgba(232,193,112,${pulse}), inset 0 0 24px rgba(232,193,112,.18)`;
  $('url').style.opacity = eo(ramp(t, 36.9, 37.5));
  // Flashes
  let f = 0;
  for (const [ft, peak, atk, dec] of flashes) {
    if (t >= ft - atk && t < ft) f = Math.max(f, peak * ramp(t, ft - atk, ft));
    else if (t >= ft && t < ft + dec) f = Math.max(f, peak * (1 - eo((t - ft) / dec)) );
  }
  // White-out from the nuke into the title
  if (t >= 32.15 && t < 32.5) f = Math.max(f, ei(ramp(t, 32.15, 32.5)));
  if (t >= 32.5) f = Math.max(f, 1 - eo(ramp(t, 32.5, 33.2)));
  $('flash').style.opacity = f;
  // Fade from / to black
  const ss = x => x * x * (3 - 2 * x);
  const blk = Math.max(1 - eo(ramp(t, 0, 0.7)), ss(ramp(t, 38.3, 39.35)));
  $('black').style.opacity = blk;
};
window.renderAt(0);
</script></body></html>
