<!doctype html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fragdachse · Bodennebel-Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101c22;color:#e1ece9;font:14px system-ui}header{padding:14px 22px;border-bottom:1px solid #365058;display:flex;align-items:center;gap:22px}h1{font-size:21px;margin:0}p{margin:3px 0;color:#adc3bd}main{display:grid;grid-template-columns:300px minmax(0,1fr);height:calc(100vh - 80px)}aside{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:#14262b}label{display:flex;justify-content:space-between;align-items:center;gap:8px}input,select,button{background:#28434a;border:1px solid #527478;border-radius:5px;color:#eef8f3;padding:6px;font:inherit}input[type=range]{width:145px}input[type=number]{width:100px}button{cursor:pointer}button:hover{background:#3d6267}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{flex:1;min-width:100px}#stage{width:100%;height:100%;min-width:0;min-height:0;overflow:hidden;position:relative}output,pre{white-space:pre-wrap;line-height:1.5;font-size:12px;margin:0}fieldset{border:1px solid #365058;border-radius:6px;display:flex;flex-direction:column;gap:9px}a{color:#a7dcd3}#report{max-height:180px;overflow:auto}.hint{font-size:12px}details{border-top:1px solid #365058;padding-top:10px}
</style></head><body>
<header><h1>Bodennebel-Lab</h1><p>Produktionsrenderer · Weltfester GPU-Zustand · reproduzierbare Szenarien</p><a href="/water-lab.html">Wasser-Lab</a></header>
<main><aside>
<label>Szenario<select id="scenario"><option value="landscape">Wasser / Rasen / Dirt</option><option value="barrier">Wand / Durchbruch</option><option value="nuke">Nuke / große Öffnung</option><option value="base">Basis / Neubau</option><option value="motion">Figuren / Teleport</option><option value="projectiles">Projektilspuren</option><option value="readability">Smoke / Lesbarkeit</option><option value="camera">Kamera / Cache</option><option value="train">Zug / Nachlauf</option></select></label>
<label>Seed<input id="seed" type="number" value="183" min="0" max="999999"></label>
<label>Vergleich<select id="mode"><option value="full">Alle Reaktionen</option><option value="ambient">Grundnebel</option><option value="off">Aus</option></select></label>
<label>Qualität<select id="quality"><option>high</option><option>medium</option><option>low</option></select></label>
<label>Tageszeit<input id="time" type="range" min="0" max="1439" value="360"><span id="clock">06:00</span></label>
<label>Nebelstärke<input id="strength" type="range" min="0" max="2" step=".05" value="1"></label>
<label>Ansicht<select id="debug"><option value="normal">Spielbild</option><option value="barriers">Transportmaske</option><option value="surface">Darstellungsmaske</option><option value="water">Wassergewichtung</option><option value="density">Dichte</option><option value="unreached">Unerreichte Öffnungen</option><option value="velocity">Geschwindigkeit</option><option value="impulses">Impulse</option></select></label>
<fieldset><legend>Material</legend><label>Deckkraft<input id="opacity" type="range" min=".05" max=".55" step=".01" value=".50"></label><label>Detail<input id="detail" type="range" min="0" max="1" step=".05" value=".65"></label><label>Wind X<input id="windX" type="range" min="-40" max="40" value="3"></label><label>Wind Y<input id="windY" type="range" min="-40" max="40" value="2"></label><label>Mäandern<input id="meander" type="range" min="0" max="2" step=".1" value="1"></label><label>Reaktion<input id="reaction" type="range" min="0" max="2" step=".1" value="1"></label></fieldset>
<div class="actions"><button id="pause">Pause</button><button id="step">Einzelschritt</button><button id="reset">Welt neu aufbauen</button><button id="destroy">Durchbruch</button><button id="explode">Explosion</button><button id="build">Bauen / Entfernen</button><button id="motion">Laufen / Dash</button><button id="teleport">Teleport</button><button id="shots">Dauerfeuer</button><button id="fire">Einzelschuss / Schlag</button><button id="pan">Kamerapfad</button><button id="zoom">Zoom 100 %</button><button id="shake">Kamerawackeln</button><button id="longframe">Langer Frame</button></div>
<label>Bewegung<select id="motionPattern"><option value="cycle">Laufen / Dash / Stillstand</option><option value="walk">Nur Laufen</option><option value="dash">Nur Dash</option></select></label><label>Geschoss<select id="weapon"><option value="p90">P90</option><option value="glock">Glock</option><option value="shotgun">Schrot</option><option value="rocket">Rakete</option><option value="plasma">Plasma</option><option value="fireball">Feuerball</option><option value="bounce">Abpraller</option><option value="short">Kurzlebig (12 ms)</option><option value="hitscan">Hitscan</option><option value="melee">Nahkampf</option><option value="flame">Flammenwerfer</option><option value="leaf_blower">Laubbläser</option><option value="bfg">BFG</option></select></label>
<label>Spurbreite ×<input id="trailWidth" type="number" min="0" max="8" step=".1" value="1"></label>
<label>Spurdauer ×<input id="trailDuration" type="number" min="0" max="8" step=".1" value="1"></label>
<label>Pfadquelle<select id="pathMode"><option value="authored">Wie im Spiel</option><option value="pose">Ohne Flugbahnhistorie</option></select></label>
<label>Schussrichtung<select id="shotPattern"><option value="straight">Gerade</option><option value="diagonal">Diagonal</option><option value="fan">Schwenkender Fächer</option></select></label>
<label>Schützen<select id="shooters"><option>1</option><option>4</option></select></label><label>Projektile pro Schuss<select id="pellets"><option>1</option><option>3</option></select></label>
<output id="status" aria-live="polite">Vorbereitung …</output>
<details open><summary>Messung und Reproduktion</summary><p class="hint">GPU-Auslesungen nur bei Vertragsprüfungen. Benchmarks: 10 s Warmup + 3 × 30 s je Variante.</p><div class="actions"><button id="verify">GPU-Verträge prüfen</button><button id="benchmark">A/B/C messen</button><button id="benchmarkFull">Reaktionen messen</button><button id="export">JSON exportieren</button><button id="url">URL aktualisieren</button></div><pre id="report"></pre></details>
</aside><div id="stage"></div></main>
<script type="module" src="/src/dev/fogLab.ts"></script></body></html>
